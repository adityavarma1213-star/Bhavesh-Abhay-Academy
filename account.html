<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BAA Account</title>
<style>body{font-family:system-ui,sans-serif;background:linear-gradient(135deg,#102a56,#1677a8);margin:0;min-height:100vh;display:grid;place-items:center}.card{background:#fff;border-radius:22px;padding:28px;max-width:430px;width:calc(100% - 32px);box-shadow:0 20px 60px #0005}.tabs{display:flex;gap:8px;margin-bottom:20px}.tabs button{flex:1;padding:12px;border:0;border-radius:10px;background:#eaf7ff;cursor:pointer}.tabs .active{background:#2767b1;color:white}.field{margin:10px 0}.field label{display:block;font-weight:700;font-size:13px;margin-bottom:5px}.field input,.field select{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccd8e5;border-radius:10px}.primary{width:100%;padding:13px;border:0;border-radius:10px;background:#173b73;color:#fff;font-weight:700;cursor:pointer}.primary:disabled{opacity:.6;cursor:not-allowed}.remember{display:flex;align-items:center;gap:8px;margin:8px 0 14px;font-size:13px;color:#425466}.remember input{width:16px;height:16px}.msg{margin-top:12px;padding:10px;border-radius:9px;background:#f1f7fb}.small{font-size:12px;color:#607d8b}</style><link rel="stylesheet" href="css/baa-themes.css">
</head>
<body><main class="card"><h1>🎓 BAA Account</h1><p class="small">Secure account access for production BAA deployments. Your session is stored securely in an HTTP-only cookie.</p><div class="tabs"><button id="loginTab" class="active">Login</button><button id="signupTab">Create account</button></div>
<section id="login"><div class="field"><label>Email</label><input id="loginEmail" type="email" autocomplete="username"></div><div class="field"><label>Password</label><input id="loginPassword" type="password" autocomplete="current-password"></div><label class="remember"><input id="rememberMe" type="checkbox"> <span>Keep me signed in</span></label><button class="primary" id="loginBtn">Login</button><p><a href="#" id="forgotPasswordLink">Forgot password?</a></p></section>
<section id="signup" hidden><div class="field"><label>Name</label><input id="signupName" autocomplete="name"></div><div class="field"><label>Email</label><input id="signupEmail" type="email" autocomplete="email"></div><div class="field"><label>Password (8+ characters)</label><input id="signupPassword" type="password" autocomplete="new-password"></div><div class="field"><label>Role</label><select id="signupRole"><option value="student">Student</option><option value="parent">Parent</option><option value="teacher">Teacher</option></select></div><button class="primary" id="signupBtn">Create account</button></section><div id="msg" class="msg" hidden></div><p><a href="index.html">← Back to BAA</a></p></main>
<script>
const API='/api/auth';const $=id=>document.getElementById(id);function msg(t){$('msg').hidden=false;$('msg').textContent=t}
$('loginTab').onclick=()=>{ $('loginTab').classList.add('active');$('signupTab').classList.remove('active');$('login').hidden=false;$('signup').hidden=true;};
$('signupTab').onclick=()=>{ $('signupTab').classList.add('active');$('loginTab').classList.remove('active');$('login').hidden=true;$('signup').hidden=false;};
async function call(path,body){const r=await fetch(API+path,{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j?.error?.message||'Request failed');return j;}
$('loginBtn').onclick=async()=>{const btn=$('loginBtn');btn.disabled=true;try{await call('/login',{email:$('loginEmail').value,password:$('loginPassword').value,remember:$('rememberMe').checked});msg($('rememberMe').checked?'Login successful — you will stay signed in for 30 days. Opening BAA…':'Login successful. Opening BAA…');setTimeout(()=>location.href='student-os.html',400)}catch(e){msg(e.message)}finally{btn.disabled=false}};
$('signupBtn').onclick=async()=>{const btn=$('signupBtn');btn.disabled=true;try{await call('/signup',{name:$('signupName').value,email:$('signupEmail').value,password:$('signupPassword').value,role:$('signupRole').value});msg('Account created. Please log in.');$('loginTab').click()}catch(e){msg(e.message)}finally{btn.disabled=false}};
$('forgotPasswordLink').onclick=async e=>{e.preventDefault();const email=prompt('Enter the email address for your BAA account:');if(!email)return;try{const r=await call('/request-password-reset',{email});msg(r.emailSent?'Reset link sent. Check your email.':'Reset request received, but email delivery is not configured yet. Please contact the site administrator.')}catch(e){msg(e.message)}};
</script><script src="js/baa-themes.js"></script>
</body></html>
