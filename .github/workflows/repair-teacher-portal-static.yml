name: Repair Teacher Portal Static Entry

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !startsWith(github.event.head_commit.message, '[auto]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make Teacher Portal statically reachable
        run: |
          python3 - <<'PY'
          from pathlib import Path

          card = '''\n<!-- BAA TEACHER PORTAL: static discoverability entry -->\n<style id="baa-teacher-portal-static-style">\n#baa-teacher-portal-entry{margin:0 0 24px;padding:22px 24px;border:1px solid rgba(245,185,66,.42);border-radius:20px;background:linear-gradient(135deg,rgba(124,92,252,.16),rgba(76,217,232,.08));box-shadow:0 12px 34px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:space-between;gap:18px;position:relative;z-index:30}\n#baa-teacher-portal-entry .tp-copy{min-width:0}\n#baa-teacher-portal-entry .tp-kicker{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:#F5B942;font-weight:700;margin-bottom:6px}\n#baa-teacher-portal-entry .tp-title{font-size:1.05rem;font-weight:700;color:#FDF9F0;margin-bottom:5px}\n#baa-teacher-portal-entry .tp-sub{font-size:.82rem;line-height:1.45;color:rgba(253,249,240,.68)}\n#baa-teacher-portal-entry .tp-btn{display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;padding:11px 17px;border-radius:999px;background:#F5B942;color:#0B0F2E;font-weight:800;text-decoration:none;border:0;box-shadow:0 8px 22px rgba(245,185,66,.25)}\n#baa-teacher-portal-entry .tp-btn:hover{transform:translateY(-1px)}\n@media(max-width:640px){#baa-teacher-portal-entry{align-items:flex-start;flex-direction:column}.tp-btn{width:100%}}\n</style>\n<div id="baa-teacher-portal-entry" aria-label="Teacher and Academic Management">\n  <div class="tp-copy">\n    <div class="tp-kicker">Academic Management</div>\n    <div class="tp-title">👩‍🏫 Teacher Portal</div>\n    <div class="tp-sub">Manage classes, syllabus, students, assessments and teacher tools.</div>\n  </div>\n  <a class="tp-btn" href="account.html?role=teacher" aria-label="Open Teacher Portal">Open Teacher Portal →</a>\n</div>\n'''

          paths = [Path('student-os.html'), Path('Bhavesh-Abhay-Academy-main/student-os.html')]
          for path in paths:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              if 'id="baa-teacher-portal-entry"' in text:
                  continue
              marker = '<div class="home-inner">'
              if marker in text:
                  text = text.replace(marker, marker + card, 1)
              else:
                  text = text.replace('</body>', card + '</body>', 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit repair and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add student-os.html Bhavesh-Abhay-Academy-main/student-os.html
          git rm -f .github/workflows/repair-teacher-portal-static.yml
          git diff --cached --quiet && exit 0
          git commit -m "[auto] Make Teacher Portal statically visible in Student OS"
          git push
