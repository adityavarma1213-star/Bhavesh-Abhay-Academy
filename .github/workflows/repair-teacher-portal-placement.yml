name: Place Teacher Portal Inside Student OS

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !startsWith(github.event.head_commit.message, '[auto]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move Teacher Portal card into active home screen
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          start='<!-- BAA TEACHER PORTAL: static discoverability entry -->'
          end='</div>\n'
          card='''<!-- BAA TEACHER PORTAL: static discoverability entry -->\n<style id="baa-teacher-portal-static-style">\n#baa-teacher-portal-entry{margin:0 0 24px;padding:22px 24px;border:1px solid rgba(245,185,66,.42);border-radius:20px;background:linear-gradient(135deg,rgba(124,92,252,.16),rgba(76,217,232,.08));box-shadow:0 12px 34px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:space-between;gap:18px;position:relative;z-index:30}\n#baa-teacher-portal-entry .tp-copy{min-width:0}\n#baa-teacher-portal-entry .tp-kicker{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:#F5B942;font-weight:700;margin-bottom:6px}\n#baa-teacher-portal-entry .tp-title{font-size:1.05rem;font-weight:700;color:#FDF9F0;margin-bottom:5px}\n#baa-teacher-portal-entry .tp-sub{font-size:.82rem;line-height:1.45;color:rgba(253,249,240,.68)}\n#baa-teacher-portal-entry .tp-btn{display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;padding:11px 17px;border-radius:999px;background:#F5B942;color:#0B0F2E;font-weight:800;text-decoration:none;border:0;box-shadow:0 8px 22px rgba(245,185,66,.25)}\n#baa-teacher-portal-entry .tp-btn:hover{transform:translateY(-1px)}\n@media(max-width:640px){#baa-teacher-portal-entry{align-items:flex-start;flex-direction:column}.tp-btn{width:100%}}\n</style>\n<div id="baa-teacher-portal-entry" aria-label="Teacher and Academic Management">\n  <div class="tp-copy">\n    <div class="tp-kicker">Academic Management</div>\n    <div class="tp-title">👩‍🏫 Teacher Portal</div>\n    <div class="tp-sub">Manage classes, syllabus, students, assessments and teacher tools.</div>\n  </div>\n  <a class="tp-btn" href="account.html?role=teacher" aria-label="Open Teacher Portal">Open Teacher Portal →</a>\n</div>\n'''

          for raw in ['student-os.html','Bhavesh-Abhay-Academy-main/student-os.html']:
              p=Path(raw)
              if not p.exists():
                  continue
              s=p.read_text(encoding='utf-8')
              # Remove every previous static card block, including the old fallback placement.
              s=re.sub(r'\\s*<!-- BAA TEACHER PORTAL: static discoverability entry -->.*?<div id="baa-teacher-portal-entry".*?</div>\\s*</div>\\s*', '\\n', s, flags=re.S)
              # Insert inside the actual Student OS home container.
              m=re.search(r'<div\\s+class=["\\\']home-inner["\\\'][^>]*>', s)
              if m:
                  s=s[:m.end()]+"\\n"+card+s[m.end():]
              else:
                  # Keep it visible in the active UI even if the markup changes.
                  s=s.replace('</body>', card+'</body>', 1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit repair and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add student-os.html Bhavesh-Abhay-Academy-main/student-os.html
          git rm -f .github/workflows/repair-teacher-portal-placement.yml
          git diff --cached --quiet && exit 0
          git commit -m "[auto] Place Teacher Portal inside Student OS home"
          git push
