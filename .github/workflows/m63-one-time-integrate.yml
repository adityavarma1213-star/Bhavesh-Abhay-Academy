name: M63 one-time integration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    if: "!contains(github.event.head_commit.message, 'M63 one-time integration')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Integrate Guide Robot into BAA pages
        shell: bash
        run: |
          set -euo pipefail
          pages=(
            index.html
            account.html
            student-os.html
            parent-os.html
            teacher-os.html
            teacher-review.html
            teacher-portal.html
            assessment.html
            homework-scanner.html
            knowledge-universe.html
            mathematics-world.html
            feature-map.html
            trust-privacy.html
            user-guide.html
          )
          for page in "${pages[@]}"; do
            test -f "$page" || { echo "Missing expected M63 page: $page"; exit 1; }
            node - "$page" <<'NODE'
const fs=require('fs');
const file=process.argv[2];
let s=fs.readFileSync(file,'utf8');
const css='<link rel="stylesheet" href="css/baa-guide-robot.css">';
const cat='<script src="js/baa-guide-catalogue.js"></script>';
const robot='<script src="js/baa-guide-robot.js"></script>';
if(!s.includes(css)) s=s.replace(/<\/head>/i,`  ${css}\n</head>`);
if(!s.includes(cat)) s=s.replace(/<\/body>/i,`  ${cat}\n  ${robot}\n</body>`);
else if(!s.includes(robot)) s=s.replace(/<\/body>/i,`  ${robot}\n</body>`);
fs.writeFileSync(file,s);
NODE
          done

      - name: Verify M63 integrations
        run: |
          node test/run-m63-tests.js
          for page in index.html account.html student-os.html parent-os.html teacher-os.html teacher-review.html teacher-portal.html assessment.html homework-scanner.html knowledge-universe.html mathematics-world.html feature-map.html trust-privacy.html user-guide.html; do
            grep -q 'js/baa-guide-catalogue.js' "$page"
            grep -q 'js/baa-guide-robot.js' "$page"
            grep -q 'css/baa-guide-robot.css' "$page"
          done

      - name: Commit integration and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/m63-one-time-integrate.yml
          git add index.html account.html student-os.html parent-os.html teacher-os.html teacher-review.html teacher-portal.html assessment.html homework-scanner.html knowledge-universe.html mathematics-world.html feature-map.html trust-privacy.html user-guide.html .github/workflows/m63-one-time-integrate.yml
          if git diff --cached --quiet; then
            echo "No M63 integration changes required"
            exit 0
          fi
          git commit -m "feat(M63): integrate Guide Robot across BAA pages"
          git push
