name: Force Teacher Portal Visibility

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !startsWith(github.event.head_commit.message, '[auto]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace Teacher Portal entry with visible fixed overlay
        run: |
          python3 - <<'PY'
          from pathlib import Path

          marker='<!-- BAA TEACHER PORTAL: static discoverability entry -->'
          card='''<!-- BAA TEACHER PORTAL: static discoverability entry -->
          <style id="baa-teacher-portal-static-style">
          #baa-teacher-portal-entry{position:fixed;top:78px;right:24px;z-index:99999;width:min(430px,calc(100vw - 48px));padding:18px 20px;border:1px solid rgba(245,185,66,.55);border-radius:18px;background:linear-gradient(135deg,#171040,#141B4D);box-shadow:0 18px 50px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:space-between;gap:14px}
          #baa-teacher-portal-entry .tp-copy{min-width:0}
          #baa-teacher-portal-entry .tp-kicker{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:#F5B942;font-weight:800;margin-bottom:5px}
          #baa-teacher-portal-entry .tp-title{font-size:1rem;font-weight:800;color:#FDF9F0;margin-bottom:4px}
          #baa-teacher-portal-entry .tp-sub{font-size:.76rem;line-height:1.4;color:rgba(253,249,240,.68)}
          #baa-teacher-portal-entry .tp-btn{display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;padding:10px 14px;border-radius:999px;background:#F5B942;color:#0B0F2E;font-weight:800;text-decoration:none}
          @media(max-width:640px){#baa-teacher-portal-entry{top:64px;left:12px;right:12px;width:auto;flex-direction:column;align-items:stretch}.tp-btn{width:100%}}
          </style>
          <div id="baa-teacher-portal-entry" aria-label="Teacher and Academic Management">
            <div class="tp-copy"><div class="tp-kicker">Academic Management</div><div class="tp-title">👩‍🏫 Teacher Portal</div><div class="tp-sub">Manage classes, syllabus, students, assessments and teacher tools.</div></div>
            <a class="tp-btn" href="account.html?role=teacher" aria-label="Open Teacher Portal">Open Teacher Portal →</a>
          </div>
          '''
          card='\n'.join(line[10:] if line.startswith('          ') else line for line in card.splitlines())+'\n'
          for raw in ['student-os.html','Bhavesh-Abhay-Academy-main/student-os.html']:
              p=Path(raw)
              if not p.exists(): continue
              s=p.read_text(encoding='utf-8')
              while marker in s:
                  a=s.index(marker); b=s.find('</body>',a)
                  if b<0: break
                  s=s[:a]+s[b:]
              s=s.replace('</body>',card+'</body>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add student-os.html Bhavesh-Abhay-Academy-main/student-os.html
          git rm -f .github/workflows/force-teacher-portal-overlay.yml
          git diff --cached --quiet && exit 0
          git commit -m "[auto] Force Teacher Portal visibility in Student OS"
          git push
