name: Finalize Teacher Portal Placement

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !startsWith(github.event.head_commit.message, '[auto]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Put one clean Teacher Portal card inside Student OS home
        run: |
          python3 - <<'PY'
          from pathlib import Path

          card = '''<!-- BAA TEACHER PORTAL: static discoverability entry -->
          <style id="baa-teacher-portal-static-style">
          #baa-teacher-portal-entry{margin:0 0 24px;padding:22px 24px;border:1px solid rgba(245,185,66,.42);border-radius:20px;background:linear-gradient(135deg,rgba(124,92,252,.16),rgba(76,217,232,.08));box-shadow:0 12px 34px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:space-between;gap:18px;position:relative;z-index:30}
          #baa-teacher-portal-entry .tp-copy{min-width:0}
          #baa-teacher-portal-entry .tp-kicker{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:#F5B942;font-weight:700;margin-bottom:6px}
          #baa-teacher-portal-entry .tp-title{font-size:1.05rem;font-weight:700;color:#FDF9F0;margin-bottom:5px}
          #baa-teacher-portal-entry .tp-sub{font-size:.82rem;line-height:1.45;color:rgba(253,249,240,.68)}
          #baa-teacher-portal-entry .tp-btn{display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;padding:11px 17px;border-radius:999px;background:#F5B942;color:#0B0F2E;font-weight:800;text-decoration:none;border:0;box-shadow:0 8px 22px rgba(245,185,66,.25)}
          @media(max-width:640px){#baa-teacher-portal-entry{align-items:flex-start;flex-direction:column}.tp-btn{width:100%}}
          </style>
          <div id="baa-teacher-portal-entry" aria-label="Teacher and Academic Management">
            <div class="tp-copy">
              <div class="tp-kicker">Academic Management</div>
              <div class="tp-title">👩‍🏫 Teacher Portal</div>
              <div class="tp-sub">Manage classes, syllabus, students, assessments and teacher tools.</div>
            </div>
            <a class="tp-btn" href="account.html?role=teacher" aria-label="Open Teacher Portal">Open Teacher Portal →</a>
          </div>
          '''
          card='\n'.join(line[10:] if line.startswith('          ') else line for line in card.splitlines()) + '\n'
          marker='<!-- BAA TEACHER PORTAL: static discoverability entry -->'

          for raw in ['student-os.html','Bhavesh-Abhay-Academy-main/student-os.html']:
              p=Path(raw)
              if not p.exists(): continue
              s=p.read_text(encoding='utf-8')
              # Remove all previous copies that were appended outside the active screen.
              while marker in s:
                  a=s.index(marker)
                  b=s.find('</body>',a)
                  if b < 0: break
                  s=s[:a]+s[b:]
              # Insert exactly inside the Student OS home container.
              pos=s.find('class="home-inner"')
              if pos < 0:
                  pos=s.find("class='home-inner'")
              if pos >= 0:
                  gt=s.find('>',pos)
                  if gt >= 0:
                      s=s[:gt+1]+'\n'+card+s[gt+1:]
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add student-os.html Bhavesh-Abhay-Academy-main/student-os.html
          git rm -f .github/workflows/finalize-teacher-portal-placement.yml
          git diff --cached --quiet && exit 0
          git commit -m "[auto] Finalize visible Teacher Portal entry in Student OS"
          git push
