<!doctype html><meta charset="utf-8"><title>BAA UI Reachability Browser Harness</title><pre id="out">running…</pre><script>
const hosts={student:'student-os.html?name=Harness',teacher:'teacher-os.html',parent:'parent-os.html'};
const groups={student:['m31Btn','m32Speak','m35PostBtn','m35ListBtn','m36Btn','m38Btn','m39Btn','m39ListBtn','m40ProfileBtn','m40MapBtn','m41Btn','m42Start','m42Risk','m43Btn','m44Btn','m45Btn','m48Create','m48Join','m49Btn','m50Btn','m52Btn','m54Btn','m55Plan','m55Apply','m56Btn','m60Btn'],teacher:['m34Add','m34Announce','m34State','m36tBtn','m38tBtn','m39tBtn','m39tList','m40tProfile','m40tMap','m46Config','m46Payload','m47Btn','m51Btn','m53Btn','m58Group','m58Assign','m59Create','m59Decide','m61Cohort','m61Experiment','m62Create','m62Add','m62Consensus'],parent:['m57Btn']};
function wait(ms){return new Promise(r=>setTimeout(r,ms));}
async function runHost(name){return new Promise(async resolve=>{const f=document.createElement('iframe');f.src=hosts[name];f.style.display='none';document.body.appendChild(f);f.onload=async()=>{try{if(name==='student'){const d=f.contentDocument;d.getElementById('nameInput').value='Harness';d.querySelector('.btn-primary').click();await wait(4000);if(d.getElementById('greetCta')){const c=d.getElementById('greetCta');c.click();}await wait(1600);}else await wait(800);const d=f.contentDocument;const results=[];for(const id of groups[name]){const b=d.getElementById(id);if(!b){results.push({id,ok:false,reason:'missing control'});continue;}b.click();await wait(30);let outId=id.replace('Btn','Out').replace('Add','Out').replace('Announce','Out').replace('State','Out').replace('Speak','Out').replace('Start','Out').replace('Risk','Out').replace('Create','Out').replace('Join','Out').replace('Config','Out').replace('Payload','Out').replace('Group','Out').replace('Assign','Out').replace('Cohort','Out').replace('Experiment','Out').replace('Add','Out').replace('Consensus','Out');let out=d.getElementById(outId);if(!out){const m=id.match(/^(m\d+[a-z]*)/);out=m?d.getElementById(m[1]+'Out'):null;}results.push({id,ok:!!out&&out.textContent.length>0,output:out?out.textContent.slice(0,80):''});}resolve({name,results});}catch(e){resolve({name,error:String(e)});}};});}
(async()=>{const all=[];for(const n of Object.keys(hosts))all.push(await runHost(n));document.getElementById('out').textContent=JSON.stringify(all,null,2);})();
</script>
