name: BAA OS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: JavaScript syntax gate
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            node --check "$file"
            count=$((count+1))
          done < <(find . -type f -name '*.js' -not -path './node_modules/*' -print0)
          echo "Syntax checked $count JavaScript files"
      - name: Run regression suites
        shell: bash
        run: |
          set -euo pipefail
          for file in test/run-*.js; do
            echo "===== $file ====="
            node "$file"
          done
      - name: Run G4/G5/G6 regression
        run: node test/g4g5g6/run-tests.js
